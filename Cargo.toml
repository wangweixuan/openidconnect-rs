[package]
name = "openidconnect"
version = "4.0.1"
authors = ["David A. Ramos <ramos@cs.stanford.edu>"]
description = "OpenID Connect library"
keywords = ["openid", "oidc", "oauth2", "authentication", "auth"]
license = "MIT"
repository = "https://github.com/ramosbugs/openidconnect-rs"
edition = "2021"
readme = "README.md"
rust-version = "1.65"

[package.metadata.docs.rs]
all-features = true

[badges]
maintenance = { status = "actively-developed" }

[features]
accept-rfc3339-timestamps = []
accept-string-booleans = []
curl = ["oauth2/curl"]
default = ["reqwest", "rustls-tls"]
native-tls = ["oauth2/native-tls"]
reqwest = ["oauth2/reqwest"]
reqwest-blocking = ["oauth2/reqwest-blocking"]
rustls-tls = ["oauth2/rustls-tls"]
timing-resistant-secret-traits = ["oauth2/timing-resistant-secret-traits"]
ureq = ["oauth2/ureq"]

[[example]]
name = "gitlab"
required-features = ["reqwest-blocking"]

[[example]]
name = "google"
required-features = ["reqwest-blocking"]

[[example]]
name = "okta_device_grant"
required-features = ["reqwest-blocking"]

[dependencies]
base64 = "0.23.1"
# Disable 'time' dependency since it triggers RUSTSEC-2020-0071 and we don't need it.
chrono = { version = "0.4.45", default-features = false, features = [
    "clock",
    "std",
    "wasmbind"
] }
thiserror = "1.0.69"
http = "1.5.0"
itertools = "0.15.0"
log = "0.4.34"
oauth2 = { version = "5.0.0", default-features = false }
rand = "0.10.2"
hmac = "0.13.0"
rsa = "0.9.10"
sha2 = { version = "0.11.0", features = ["oid"] } # Object ID needed for pkcs1v15 padding
p256 = "0.14.0"
p384 = "0.14.0"
dyn-clone = "1.0.20"
serde = "1.0.229"
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
serde_plain = "1.0.2"
serde_with = "3.22.0"
serde-value = "0.7"
url = { version = "2.5.8", features = ["serde"] }
subtle = "2.6.1"
ed25519-dalek = { version = "2.2.0", features = ["pem"] }

[dev-dependencies]
color-backtrace = { version = "=0.5.1" }
env_logger = "=0.9.3"
pretty_assertions = "=1.4.1"
reqwest = { version = "=0.12.28", features = ["blocking", "rustls-tls"], default-features = false }
retry = "=1.3.1"
anyhow = "=1.0.104"
